<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Owner access — Isolate Client</title>
<link rel="icon" href="/favicon.ico">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #0a0a0a;
    color: #e8edf7;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background-image: radial-gradient(ellipse 70% 50% at 50% -10%, rgba(59,130,246,.14), transparent);
  }
  .card {
    width: min(420px, 100%);
    text-align: center;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 18px;
    backdrop-filter: blur(14px);
    padding: 40px 28px;
    box-shadow: 0 24px 60px rgba(0,0,0,.55);
  }
  .tick {
    width: 58px; height: 58px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: rgba(59,130,246,.16);
    border: 1px solid rgba(59,130,246,.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    box-shadow: 0 0 30px rgba(59,130,246,.35);
  }
  h1 { font-size: 20px; font-weight: 800; color: #fff; }
  p { margin-top: 10px; font-size: 14px; color: #9aa7bd; line-height: 1.6; }
  .bar {
    margin-top: 22px;
    height: 4px;
    border-radius: 999px;
    background: rgba(255,255,255,.08);
    overflow: hidden;
  }
  .bar i {
    display: block; height: 100%;
    width: 40%;
    background: linear-gradient(90deg, transparent, #3b82f6, transparent);
    animation: slide 1s linear infinite;
  }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(350%); } }
</style>
<script>
  // Owner unlock: remember this browser, then head to the main site.
  try { localStorage.setItem("iso_owner", "1"); } catch (e) {}
  setTimeout(function () { location.replace("/"); }, 1100);
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2088322830733233" crossorigin="anonymous"></script>
</head>
<body>
  <main class="card">
    <div class="tick">✓</div>
    <h1>Owner access granted</h1>
    <p>Saving your browser key… taking you to Isolate Client.</p>
    <div class="bar"><i></i></div>
  </main>
</body>
</html>
